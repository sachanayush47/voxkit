[project]
name = "voxkit"
version = "0.0.1"
description = "A python library for building voice agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepgram-sdk>=7.4.0",
    "httpx>=0.28.1",
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "python-dotenv>=1.2.2",
    "sarvamai>=0.1.28",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]

[dependency-groups]
dev = [
    "langchain-groq>=1.1.3",
    "pre-commit>=4.6.2",
    "sounddevice>=0.5.5",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["site"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "D",    # pydocstyle -- docstrings are the published API reference, so they're linted
]
ignore = [
    "D107",  # __init__ docstring: mkdocstrings merges init into the class, which documents itself
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Runnable example, not part of the published API surface.
"main.py" = ["D100", "D103"]
# Intentionally-empty stubs (see AGENTS.md) -- nothing to document yet.
"voxkit/exceptions.py" = ["D100"]
"voxkit/vad/*" = ["D100", "D104"]
